# Local Postgres for the integration test. Nothing in the library needs it —
# MemoryStore covers examples and unit tests.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guarded
      POSTGRES_PASSWORD: guarded
      POSTGRES_DB: guarded_agent
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guarded -d guarded_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
